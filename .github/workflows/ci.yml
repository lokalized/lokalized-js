name: CI

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # THE FIRST LEG IS THE FLOOR, and it is the only one that tests `engines.node`.
        # A floor CI does not execute is a claim, not a measurement — the shape A3 and A7
        # each found for real (scenario:2k in neither verify nor CI; CI running zero spec
        # gates). Keep this equal to package.json's `engines.node` lower bound.
        node: ["20", "22", "24", "current"]
    # Every corpus-driven gate resolves `../lokalized-spec` as a SIBLING of this checkout, so both
    # repositories are checked out side by side under the workspace. Without this the spec artifacts
    # are simply absent: `npm test` skipped 43 tests and crashed 5 files outright, and `conformance`
    # — the project's central gate — could never have run at all.
    defaults:
      run:
        working-directory: lokalized-js
    steps:
      - uses: actions/checkout@v4
        with:
          path: lokalized-js
          # Plan validators reject shallow repositories: they verify capacity
          # and start-record commit ancestry with `git merge-base --is-ancestor`.
          fetch-depth: 0
      - name: Check out the behavioral corpus and pinned artifacts
        uses: actions/checkout@v4
        with:
          repository: lokalized/lokalized-spec
          # THE REF IS LOAD-BEARING. `lokalized-spec`'s DEFAULT branch (`main`) holds two files,
          # LICENSE and README — the 725 that matter, including the corpus, live on this branch.
          # Checking out the default silently produced an EMPTY-looking spec, which is why the first
          # attempt at this fix still skipped 44 tests. Override with the SPEC_REPO_REF repository
          # variable, and delete this default once the spec's default branch carries the artifacts.
          ref: ${{ vars.SPEC_REPO_REF || 'feature/spec-repo-init' }}
          path: lokalized-spec
          # Shallow is fine here: nothing reads the spec's history, only its artifacts.
          fetch-depth: 1
          # `github.token` is scoped to THIS repository. It is sufficient while lokalized-spec is
          # public; if it is ever made private, add a SPEC_REPO_TOKEN secret with read access and
          # this picks it up without another edit.
          token: ${{ secrets.SPEC_REPO_TOKEN || github.token }}
      # Fail HERE, naming the cause, rather than 10 minutes later as 44 anonymous skips. A checkout
      # that succeeds says the ref resolved, NOT that it carried what the gates read.
      - name: Verify the corpus checkout carries what the gates read
        run: |
          missing=0
          for required in \
            generated/behavioral-vectors.json \
            generated/iana-language-range-equivalents.json \
            symbol-allowlist.json \
            vendor/lokalized-java/src/build/resources/cldr/cldr-conformance-vectors.json \
            vendor/lokalized-java/src/build/resources/cldr/cldr-locale-data.json
          do
            if [ ! -f "../lokalized-spec/$required" ]; then
              echo "::error::lokalized-spec checked out but $required is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The checkout resolved but does not carry the artifacts. Almost certainly the REF:"
            echo "  ref in use: ${{ vars.SPEC_REPO_REF || 'feature/spec-repo-init' }}"
            echo "  set the SPEC_REPO_REF repository variable to the branch holding the corpus."
            exit 1
          fi

          # **AND CARRYING THE FILES IS NOT CARRYING THE RIGHT REVISION.** The five checks above
          # pass over ANY revision of the spec that has the files, which is every revision of this
          # branch — so a stale ref sails through and fails ten minutes later as a parity partition
          # count nobody reads as a checkout problem. Measured 2026-09-20: a run resolved a spec 16
          # cases behind, reported `2137/2137` where the tree records 2153, and the first red was
          # `check:readme:packed`. Three gates were queued to fail for one cause, none naming it.
          #
          # `measurements/conformance.json#corpusSha256` is the port's own record of WHICH corpus
          # every ratchet in this repository was measured against — `tools/conformance.mjs` already
          # refuses to run when it moves, deliberately. This asserts the same equality at checkout,
          # where the remedy is one variable rather than a re-record.
          recorded=$(node -p "require('./measurements/conformance.json').corpusSha256")
          live=$(sha256sum ../lokalized-spec/generated/behavioral-vectors.json | cut -d' ' -f1)
          if [ "$recorded" != "$live" ]; then
            echo "::error::the spec checkout is not the corpus this build's records were made against"
            echo "  ref in use:       ${{ vars.SPEC_REPO_REF || 'feature/spec-repo-init' }}"
            echo "  corpus recorded:  $recorded"
            echo "  corpus checked out: $live"
            echo ""
            echo "Either the ref is stale — clear the SPEC_REPO_REF repository variable so the"
            echo "workflow default applies, or point it at the branch holding the current corpus —"
            echo "or the spec moved deliberately and this repo owes a conformance re-record."
            exit 1
          fi
          echo "corpus checkout OK — $(echo "$live" | cut -c1-8), the revision this build records against"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - name: Type-check JSDoc
        run: npm run check
      - name: Emit declarations
        run: npm run types
      # THE TWO STEPS BELOW WERE IN `verify` AND IN NEITHER LIST HERE — the third time this file's
      # own warning about drift has come true, and the first time it happened to the newest gates
      # rather than the oldest. `npm run declarations` (S29) and `npm run diff:check` (S31, below)
      # were added to `verify` and never added here, so the only consumer-facing TypeScript channel
      # and the differential record both ran on the authoring machine and nowhere else. Measured
      # 2026-09-15 while wiring `check:examples`, which would have been the fourth.
      - name: Type-check the executed examples as consumer TypeScript
        run: npm run check:examples
      # Every README sample is EXECUTED and every output it claims is asserted. A README is the
      # largest prose surface this project has, and prose asserting its own correctness is the defect
      # class it has caught fourteen times.
      - name: Execute the README's samples and assert their claimed output
        run: npm run check:readme
      # AND AGAIN FROM THE PUBLISHED PACKAGE, in a directory holding nothing but the tarball and the
      # catalogs the README itself publishes. The step above runs the samples inside the repository,
      # where the whole working tree is present; measured 2026-09-16, NINE of the 42 groups were green
      # there and failed for anybody who had installed the package.
      - name: Execute the same samples as a newcomer who installed the package
        run: npm run check:readme:packed
      # The README's bundler numbers, measured by a real bundler. Until 2026-09-17 the section
      # `### What it costs a browser` opened "Measured with esbuild 0.24.2 against this checkout" and
      # carried fourteen figures in markdown that `check:readme` is structurally blind to, attributed
      # to a tool that existed nowhere in the repository — and every one of the fourteen was stale.
      # esbuild is pinned to an exact version because its output is a pure function of its input and
      # its version, which is what makes these numbers a ratchet rather than a snapshot.
      - name: Bundler sizes and containment against the packed artifact
        run: npm run check:bundle
      - name: Consumer-shaped TypeScript declaration probes
        run: npm run declarations
      # The requirement registry states 179 times that some member, parameter or return value is
      # `readonly`; this compiles one consumer-shaped probe per statement against the EMITTED
      # declarations, resolved through the package's own `exports` map. It needs the sibling spec
      # checkout above for the registry and exits 2 rather than passing when it is absent.
      - name: Registry readonly statements against the shipped declarations
        run: npm run check:readonly
      # Plan 6.3's no-build browser distribution, built by the pinned esbuild (amendment A20) and
      # checked against the prohibitions that prose puts on the BROWSER GRAPH — no Node built-ins,
      # no bare specifiers, no top-level await, no dynamic import — plus the repo-wide eval/Intl
      # rules, which until M-R S6 walked `src/` and would have passed any artifact whatsoever. It
      # builds into a temp directory; `prepack` is what writes `dist/` for the tarball.
      - name: Browser distribution and its prohibitions
        run: npm run check:dist
      # Plan 8.5's release verification, run against `npm pack` and — unlike every other gate here —
      # against the tarball INSTALLED into a clean project, which is the only resolution a consumer
      # actually gets. The browser half is recorded in measurements/release-rehearsal.json and
      # compared without a browser, on scenario:0a's rule that a green run must not need a person.
      - name: Release verification against the installed tarball
        run: npm run check:release
      # A SKIP IS A GATE THAT STOPPED GATING. Each corpus-driven test skips when the sibling spec
      # checkout is absent, which is right for a bare local clone and WRONG here: with the spec
      # checked out above, nothing may skip. Asserting that is what stops a silently shrinking suite
      # from reading as a green run — the failure mode that hid this for as long as it did.
      #
      # The status is read from `$?` on a redirected run, never through a pipe: `npm test | tail`
      # reports `tail`'s status, and this project has already banked a passing status that way.
      - name: Unit tests
        run: |
          npm test > test.log 2>&1; status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          # Format-agnostic on purpose: node --test prints `# skipped N` under TAP and `i skipped N`
          # under the spec reporter, and CI and a local run do not use the same one. An earlier
          # version of this line matched neither and could never have failed.
          skipped=$(awk '/skipped[[:space:]]+[0-9]+[[:space:]]*$/ { n = $NF } END { print n + 0 }' test.log)
          echo "skipped: ${skipped:-0}"
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::${skipped} test(s) skipped. With lokalized-spec checked out nothing may skip."
            exit 1
          fi
      # THE STEPS BELOW MIRROR `npm run verify`, IN ITS ORDER, AND THE LIST IS LOAD-BEARING. This job
      # deliberately does NOT call `npm run verify`, because the unit-test step above adds the
      # skipped-count assertion that `verify` has no way to make — so the two lists have to be kept
      # in step by hand, and they DRIFTED: `size:graph`, `likely-subtag-consumers` and
      # `spike:placeholders` were all in `verify` and in none of these steps, so they executed on the
      # authoring machine and nowhere else. If a step is added to `verify`, add it here.
      - name: Module graph classification and size
        run: npm run size:graph
      # Per-subpath graphs. Two things nothing else here watches: the CONTAINMENT rule (a subpath the
      # allowlist marks browser-reachable must not enter Node-only territory — caught even when the
      # offending module imports no Node built-in and exports nothing, which is the case the
      # package-shape scan cannot see), and the SIZE of `lokalized/{load,ssr,node}`, where M8 builds
      # most of its remaining work and where 20 KB was previously invisible to every gate.
      - name: Per-subpath module graphs and containment
        run: npm run subpath:graphs
      # M7 clause 2's inventory half. It derives the likely-subtag consumer set from `src/` and fails
      # on a consumer with no entry, an entry nothing derives, or an alias carrying a gateway past
      # the boundary. It needs only `src/` and the corpus, so unlike the eight differentials — which
      # need a JDK and a built `lokalized-java` — it can run here.
      - name: Likely-subtag consumer inventory
        run: npm run likely-subtag-consumers
      # M2 is tracked by engineering measurement rather than frozen thresholds, so these ARE the
      # gate. Conformance enforces zero failures plus a ratchet on the passing-ID set; 0a ratchets
      # the deterministic size/module figures and reports the noisy timings without gating them.
      - name: Behavioral conformance against the Java corpus
        run: npm run conformance

      # M-R S10. Both read `measurements/conformance.json`, so they follow the run that writes it.
      # `test/verify-ci-parity.test.js` is what makes this a rule rather than a habit: it compares
      # this list to `verify`'s as a set AND in order, and it fired on the commit that added these
      # two steps to `verify` alone.
      - name: Divergence document is what the declared records produce
        run: npm run divergences

      - name: Release parity declaration is what this build produces
        run: npm run parity:check
      # The nine differentials need the pinned JDK, which CI provisions none of — but their RECORDED
      # result does not, and `diff:check` is the half that re-checks it: a missing record, a recorded
      # red, an unknown or omitted entry, or a differential whose TOOL has moved since its last Java
      # run all fail here without Java.
      - name: Differential record re-check
        run: npm run diff:check
      # THE SAME SHAPE, ONE LIBRARY OVER. The README's i18next comparison is measured by running BOTH
      # libraries, and i18next is an oracle this package may not depend on — it has zero dependencies
      # and `test/package-shape.test.js` enforces that — exactly as the JDK is an oracle CI does not
      # carry. So `diff:i18next` runs it with i18next installed and `check:i18next` re-checks the
      # record here without it: a missing record, a probe that did not execute both sides, a tool
      # edited since its last real run, or a census in which the COMPETITOR NEVER WINS all fail.
      - name: i18next comparison record re-check
        run: npm run check:i18next
      - name: Scenario 0a static integration measurement
        run: npm run scenario:0a
      # M7 clause 19 as amended: the 2,000-key budgets are RECORDED and the recording is re-checked,
      # rather than being a JSON file somebody wrote once. This step cannot fail on a timing — the
      # only thing that fails it is a catalog digest that no longer matches the recorded one, which
      # would mean every median in the artifact was measured on a catalog that no longer exists.
      # Source-graph movement is reported STALE here and deliberately not gated, so CI never demands
      # that machine-dependent timings be re-recorded from whatever host happened to go red.
      - name: Scenario 2k performance and memory measurement
        run: npm run scenario:2k
      # Plan 9.2:2818's scenario 6, in CI from its first commit — which is the whole of A3's and A7's
      # proof obligation: both amendments turned on whether "recorded" meant machine-re-checked, and
      # both found a real gap the moment someone asked. It needs no JDK and no browser.
      - name: Scenario 6 edge/server negotiation measurement
        run: npm run scenario:6
      # Plan 9.3's sixth measurement, "Node server concurrency with per-call locales", which had no
      # recorded scenario until M-D S23 — the only numbers for it lived in a README sentence. What
      # runs here is the CORRECTNESS half: every interleaved request must see only its own locale,
      # and the negative control must come back WRONG or nothing interleaved. The milliseconds are
      # reported and never gated, so this is safe on a shared CI runner.
      - name: Scenario concurrency (per-call locales under interleaving)
        run: npm run scenario:concurrency
      # Plan 9.3's "construction PEAK memory", which retained-memory figures are not. Peak is found
      # by bisecting --max-old-space-size in a child process, because a sampler on the same thread
      # cannot observe a synchronous operation's own peak. The caps are REPORTED; what is gated here
      # is that the largest catalog costs more than the runtime's own floor, without which the run
      # would be measuring node and looking exactly like a result.
      - name: Scenario peak construction memory
        run: npm run scenario:peak-memory
      # A clause may not be recorded PROVEN without a gate that exists on disk AND an ablation that
      # was actually performed. M8's close-out was otherwise going to be a prose verdict table, and a
      # close-out that reads its own prose back to itself is this project's most-repeated defect.
      - name: M8 acceptance-clause ledger
        run: npm run clause:ledger
      - name: Generated-placeholder spike
        run: npm run spike:placeholders

      # THE SPEC REPOSITORY'S OWN GATES, which nothing in CI ran until 2026-09-11.
      #
      # This job already checked lokalized-spec out for its ARTIFACTS and never ran its CHECKS, so
      # every spec-side ratchet was re-verified only when a human happened to run `npm run check`
      # there. `check:coverage` is the one that matters most: it fails on an undispositioned branch
      # AND on a STALE one, and slice S14 moved it — four dispositions deleted — with no automated
      # re-check behind the claim. That is the same shape as clause 19's proof obligation, found the
      # same way, and it is fixed here rather than argued around.
      #
      # EIGHT OF THE FIFTEEN RUN HERE. The exclusions are measured, not assumed, and each is named
      # so a reader does not mistake this for the whole suite:
      #   check:allowlist, check:surface, check:registry, check:documentation-topics,
      #   check:parity-obligations                        — resolve the PLAN through
      #     scripts/planning-path.mjs and exit 2 with a remedy when it is absent. The planning
      #     directory is deliberately outside every checkout and is not pushed, so these cannot run
      #     in CI by design. Measured 2026-09-19: each exits 2 naming LOKALIZED_PLANNING_DIR.
      #   check:vectors, check:iana                       — drive the pinned JDK against
      #     lokalized-java, which this workflow does not check out or build. Measured: exit 1 naming
      #     the JDK path. They fail LOUDLY rather than skipping, which is why they are excluded here
      #     rather than run and ignored.
      #
      # **THIS LIST WAS HAND-MAINTAINED AND HAD DRIFTED TWICE OVER BY M-R S13** — it read "SIX OF
      # THE TWELVE" while the spec's `check` had grown to fifteen, and two CI-RUNNABLE gates were
      # missing: `check:iana-registry`, which had never been here, and `check:provenance`, added
      # that day. `test/verify-ci-parity.test.js` deliberately skips any step with a
      # `working-directory` — correctly, since those are another package's scripts — so the drift
      # this workflow's own comment warns about was gated on THIS repo's list and on nothing here.
      # It is gated both ways now: that file requires every `check:*` in the spec's `npm run check`
      # to appear below or in a declared exclusion.
      #
      # Measured 2026-09-19 with LOKALIZED_PLANNING_DIR and LOKALIZED_ORACLE_JDK pointing nowhere:
      # these eight exit 0, the five plan gates exit 2, the two JDK gates exit 1. The spec VENDORS
      # what it needs of lokalized-java, so that repo's absence costs nothing here.
      - name: Spec-repo gates that need neither the plan nor the JDK
        working-directory: lokalized-spec
        run: |
          npm run check:snapshot
          npm run check:schemas
          npm run check:partitions
          npm run check:iana-registry
          npm run check:provenance
          npm run check:datalock
          npm run check:archive
          npm run check:coverage

  packed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # THE FLOOR, deliberately: a fresh installer on the oldest supported runtime is
          # exactly what a packed-artifact check is for. Tracks engines.node's lower bound.
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run types
      # Plan section 9.1: release verification runs against `npm pack`,
      # not the working tree.
      - name: Verify packed artifact
        run: |
          npm pack --silent
          tar -tzf lokalized-*.tgz | sort > packed-files.txt
          echo "--- packed contents ---"; cat packed-files.txt
          for required in package/LICENSE package/NOTICE package/package.json; do
            grep -qx "$required" packed-files.txt || { echo "missing $required"; exit 1; }
          done
          for forbidden in '^package/test/' '^package/\.github/' '^package/tsconfig\.json$'; do
            if grep -qE "$forbidden" packed-files.txt; then
              echo "must not be packed: $forbidden"; exit 1
            fi
          done
          echo "packed artifact OK"
